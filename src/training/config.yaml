seed: 42
deterministic: true

paths:
  workspace: /workspace/Fin-tuning-RundPod
  data_raw: /workspace/Fin-tuning-RundPod/data/raw
  data_cleaned: /workspace/Fin-tuning-RundPod/data/cleaned
  data_augmented: /workspace/Fin-tuning-RundPod/data/augmented
  data_external: /workspace/Fin-tuning-RundPod/data/external
  models: /workspace/Fin-tuning-RundPod/src/models/checkpoints
  submissions: /workspace/Fin-tuning-RundPod/src/submissions
  reports: /workspace/Fin-tuning-RundPod/src/reports
  logs: /workspace/Fin-tuning-RundPod/src/logs

# ─── Dataset selection ─────────────────────────────────────────────────────
# v2: points at the augmented dataset from the pipeline output.
# Pipeline writes: data/augmented/final_train.csv (cleaned + augmented rows)
dataset:
  train_file: data/augmented/final_train.csv     # ← was data/cleaned/train_clean.csv
  val_file: data/cleaned/val_clean.csv
  test_file: data/raw/Test.csv
  id_col: ID
  input_col: input
  output_col: output
  subset_col: subset
  languages:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha
  - Eng_Eth
  - Lug_Uga
  - Eng_Ken
  - Swa_Ken
  - Amh_Eth

nllb_codes:
  Eng_Uga: eng_Latn
  Aka_Gha: aka_Latn
  Eng_Gha: eng_Latn
  Eng_Eth: eng_Latn
  Lug_Uga: lug_Latn
  Eng_Ken: eng_Latn
  Swa_Ken: swh_Latn
  Amh_Eth: amh_Ethi

# ─── Model (unchanged from v1) ─────────────────────────────────────────────
model:
  base_model: bigscience/mt0-xl
  max_input_length: 256
  max_output_length: 384
  load_in_8bit: false
  use_fast_tokenizer: false
  block_sentinel_tokens: true

# ─── LoRA — v2 changes: rank 32 → 64, alpha kept equal to r (scale=1.0) ────
# Reasoning: v1 grad norms were ~0.15, clip threshold never engaged. We have
# room for more trainable parameters. r=64 doubles capacity from 73M to ~150M
# trainable params — still tiny vs the 3.7B frozen base.
lora:
  enabled: true
  r: 64                             # was 32
  lora_alpha: 64                    # was 32 — kept equal to r (scale=1.0, stable)
  lora_dropout: 0.05
  target_modules:
  - q
  - k
  - v
  - o
  - wi_0
  - wi_1
  - wo
  bias: none
  task_type: SEQ_2_SEQ_LM

# ─── Optimiser — v2 changes: LR 1e-5 → 3e-5, clip 0.5 → 1.0 ────────────────
# Reasoning: v1 grad norms stayed 0.1–0.3 throughout training — well below
# the clip threshold of 0.5. The optimizer was barely moving weights. 3× LR
# is reasonable and the relaxed clip lets natural larger steps through.
optimiser:
  type: adamw_torch
  lr: 3.0e-5                        # was 1.0e-5 (3× higher)
  weight_decay: 0.01
  lr_scheduler: cosine
  warmup_ratio: 0.05
  label_smoothing: 0.0
  max_grad_norm: 1.0                # was 0.5 (now that bf16 is proven stable)

# ─── Training — v2 changes: 3 → 5 epochs, batch 16 → 12, eval_loss selection ─
training:
  epochs: 8                         # was 3 — loss was still decreasing at end of v1
  output_dir_suffix: mt0_xl_a100_v2 # ← separate dir from v1
  early_stopping_patience: 3        # was 2 — let the model explore longer

  # Auto batch sizing (initial, pre-OOM)
  # v2 batch 12 — matches the size that survived OOM in v1; faster startup,
  # avoids the first OOM retry that costs ~2 min on attempt 1.
  auto_batch_size: true
  target_effective_batch: 72        # was 64 — slight bump with the larger batch
  per_device_train_batch: 12        # was 16 (will retry-shrink if OOM)
  per_device_eval_batch: 24
  gradient_accumulation: 6          # keeps effective batch = 12 × 6 = 72

  # OOM retry bounds — unchanged
  min_batch_size: 1
  min_per_device_train_batch: 1
  max_per_device_train_batch: 24
  min_per_device_eval_batch: 1
  max_per_device_eval_batch: 48
  eval_batch_multiplier: 2.0
  auto_find_batch_size: false

  mixed_precision: bf16
  gradient_checkpointing: false
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 2
  logging_steps: 25
  eval_enabled: true
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  save_safetensors: true
  predict_with_generate: true
  generation_num_beams: 1
  load_best_model_at_end: true

  # v2 change: select best checkpoint by EVAL LOSS, not ROUGE.
  # Reasoning: training-time ROUGE uses greedy decoding on an 800-sample
  # subset — noisy signal. Eval loss is computed on the full eval batch
  # and is more stable. Final beam-search ROUGE is measured separately by
  # eval_full.py after training.
  metric_for_best_model: eval_loss  # was rougeL
  greater_is_better: false          # was true (loss = lower is better)

  resume_from_checkpoint: auto
  eval_max_samples: 800

# ─── Curriculum (disabled, same as v1) ─────────────────────────────────────
curriculum:
  enabled: false
  phase1_epochs: 0
  phase2_epochs: 8                  # match epochs above
  phase1_langs:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha

# ─── Translation / augmentation config (kept for reference) ────────────────
translation:
  model_name: facebook/nllb-200-1.3B
  num_beams: 2
  batch_size: 384
  max_length: 384

augmentation:
  target_ratio:
    Eng_Uga: 1.0
    Aka_Gha: 1.7
    Eng_Gha: 1.7
    Eng_Eth: 2.0
    Lug_Uga: 2.2
    Eng_Ken: 3.0
    Swa_Ken: 3.0
    Amh_Eth: 4.0
  chrf_threshold: 0.10
  chrf_threshold_per_lang:
    Aka_Gha: 0.10
    Lug_Uga: 0.10
    Swa_Ken: 0.05
    Amh_Eth: 0.0005
  semantic_cos_threshold: 0.3
  length_ratio_min: 0.5
  length_ratio_max: 20.0

quality_gate:
  min_question_tokens: 5
  min_answer_tokens: 10
  max_answer_tokens: 512
  lang_id_workers: 8
  near_dedup_threshold: 0.85
  toxicity_threshold: 0.5
  toxicity_batch_size: 64
  semantic_cos_threshold: 0.55
  semantic_batch_size: 128
  max_repetition_ratio: 0.4
  repetition_ngram_size: 4
  max_novel_token_ratio: 0.6
  skip_medical_keyword_gate: true
  skip_hallucination_gate: true

temperature_sampling:
  enabled: true
  temperature: 5.0

# ─── Decoding (final-eval / submission) — unchanged from v1 ────────────────
decoding:
  default:
    num_beams: 8
    length_penalty: 0.8
    no_repeat_ngram: 4
    repetition_penalty: 1.2
    min_length: 10
  per_language:
    Aka_Gha: { num_beams: 6, length_penalty: 1.0, no_repeat_ngram: 3 }
    Amh_Eth: { num_beams: 8, length_penalty: 0.8, no_repeat_ngram: 2 }
    Lug_Uga: { num_beams: 6, length_penalty: 1.0, no_repeat_ngram: 3 }
    Swa_Ken: { num_beams: 8, length_penalty: 0.8, no_repeat_ngram: 3 }
    Eng_Uga: { num_beams: 8, length_penalty: 0.6, no_repeat_ngram: 4 }

evaluation:
  dump_predictions: true
  dump_predictions_n: 50
  dump_predictions_seed: 42
  dump_predictions_dir: prediction_dumps
  rouge_types:
  - rouge1
  - rougeL
  metric_weights:
    rouge1_f1: 0.37
    rougeL_f1: 0.37
    llm_judge: 0.26

tracking:
  backend: none
  experiment: african-health-qa
  run_name: mt0-xl-a100-80gb-bf16-lora-v2

serving:
  host: 0.0.0.0
  port: 8000
  disclaimer:
    Eng_Uga: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Gha: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Eth: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Ken: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Aka_Gha: Nsɛm yi yɛ nsɛm a wɔde ho kɔ adwene mu nko ara. Fa wo ho kɔ onyansafo
      okra ho adwene.
    Amh_Eth: ይህ መልስ ለመረጃ ዓላማ ብቻ ነው። እባክዎ ለሕክምና ምክር ብቁ ጤና ባለሙያ ያነጋግሩ።
    Lug_Uga: Okuddamu kuno kwe kulaga amawulire bukabu. Ndowooza ogende gy'omudaala
      omanyi.
    Swa_Ken: Jibu hili ni kwa madhumuni ya habari tu. Tafadhali wasiliana na mtaalamu
      wa afya.