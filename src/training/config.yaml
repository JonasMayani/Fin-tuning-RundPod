seed: 42
deterministic: true

paths:
  workspace: /workspace/Fin-tuning-RundPod
  data_raw: /workspace/Fin-tuning-RundPod/data/raw
  data_cleaned: /workspace/Fin-tuning-RundPod/data/cleaned
  data_augmented: /workspace/Fin-tuning-RundPod/data/augmented
  data_external: /workspace/Fin-tuning-RundPod/data/external
  models: /workspace/Fin-tuning-RundPod/src/models/checkpoints
  submissions: /workspace/Fin-tuning-RundPod/src/submissions
  reports: /workspace/Fin-tuning-RundPod/src/reports
  logs: /workspace/Fin-tuning-RundPod/src/logs

# ─── Dataset ───────────────────────────────────────────────────────────────
# Augmented data WITH the prefix kept in — empirically stripping it lowers
# ROUGE because the references contain it too.
dataset:
  train_file: data/augmented/final_train_v2.csv
  val_file: data/cleaned/val_clean.csv
  test_file: data/raw/Test.csv
  id_col: ID
  input_col: input
  output_col: output
  subset_col: subset
  languages:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha
  - Eng_Eth
  - Lug_Uga
  - Eng_Ken
  - Swa_Ken
  - Amh_Eth

nllb_codes:
  Eng_Uga: eng_Latn
  Aka_Gha: aka_Latn
  Eng_Gha: eng_Latn
  Eng_Eth: eng_Latn
  Lug_Uga: lug_Latn
  Eng_Ken: eng_Latn
  Swa_Ken: swh_Latn
  Amh_Eth: amh_Ethi

# ─── Model ─────────────────────────────────────────────────────────────────
model:
  base_model: bigscience/mt0-xl
  max_input_length: 256
  max_output_length: 384
  load_in_8bit: false
  use_fast_tokenizer: false
  block_sentinel_tokens: true

# ─── LoRA — v3: r=128 (283M trainable params, ~7% of 4B model) ─────────────
lora:
  enabled: true
  r: 128
  lora_alpha: 128                 # = r (scale 1.0)
  lora_dropout: 0.1               # higher than v2's 0.05 to regularize the bigger adapter
  target_modules:
  - q
  - k
  - v
  - o
  - wi_0
  - wi_1
  - wo
  bias: none
  task_type: SEQ_2_SEQ_LM

# ─── Optimiser — v3: LR 5e-5 (up from 3e-5) ────────────────────────────────
optimiser:
  type: adamw_torch
  lr: 5.0e-5
  weight_decay: 0.01
  lr_scheduler: cosine
  warmup_ratio: 0.05
  label_smoothing: 0.0
  max_grad_norm: 1.0              # correctly clips the occasional spike to 4+

# ─── Training — v3: batch 6 from the start (THE KEY FIX) ───────────────────
# In the previous v3 run, auto_batch_size picked 24, which OOM'd twice
# (24→12→6) before stabilizing at 6, wasting ~22 min on cold restarts.
# The r=128 model only fits at batch 6 on A100 80GB, so we start there
# directly and disable auto-sizing. Effective batch stays 72 (6 × 12).
training:
  epochs: 8
  output_dir_suffix: mt0_xl_a100_v3
  early_stopping_patience: 3

  # FIXED: start at the size that actually fits, skip the OOM dance
  auto_batch_size: false          # was true — it picked 24 and OOM'd
  target_effective_batch: 72
  per_device_train_batch: 8       # was 24 → fits r=128 directly
  per_device_eval_batch: 12       # was 48 → eval also needs to be smaller
  gradient_accumulation: 12       # 6 × 12 = effective batch 72

  # OOM retry bounds (kept as a safety net even though we start small)
  min_batch_size: 1
  min_per_device_train_batch: 1
  max_per_device_train_batch: 12
  min_per_device_eval_batch: 1
  max_per_device_eval_batch: 24
  eval_batch_multiplier: 2.0
  auto_find_batch_size: false

  mixed_precision: bf16
  gradient_checkpointing: false
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 2
  logging_steps: 25
  eval_enabled: true
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  save_safetensors: true
  predict_with_generate: true
  generation_num_beams: 1         # greedy during training eval (fast)
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  resume_from_checkpoint: auto
  eval_max_samples: 800

curriculum:
  enabled: false
  phase1_epochs: 0
  phase2_epochs: 8
  phase1_langs:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha

translation:
  model_name: facebook/nllb-200-1.3B
  num_beams: 2
  batch_size: 384
  max_length: 384

augmentation:
  target_ratio:
    Eng_Uga: 1.0
    Aka_Gha: 1.7
    Eng_Gha: 1.7
    Eng_Eth: 2.0
    Lug_Uga: 2.2
    Eng_Ken: 3.0
    Swa_Ken: 3.0
    Amh_Eth: 4.0
  chrf_threshold: 0.15
  chrf_threshold_per_lang:
    Aka_Gha: 0.18
    Lug_Uga: 0.18
    Swa_Ken: 0.15
    Amh_Eth: 0.005
  semantic_cos_threshold: 0.3
  length_ratio_min: 0.5
  length_ratio_max: 20.0

quality_gate:
  min_question_tokens: 5
  min_answer_tokens: 10
  max_answer_tokens: 512
  lang_id_workers: 8
  near_dedup_threshold: 0.85
  toxicity_threshold: 0.5
  toxicity_batch_size: 64
  semantic_cos_threshold: 0.55
  semantic_batch_size: 128
  max_repetition_ratio: 0.4
  repetition_ngram_size: 4
  max_novel_token_ratio: 0.6
  skip_medical_keyword_gate: true
  skip_hallucination_gate: true

temperature_sampling:
  enabled: true
  temperature: 5.0

# ─── Decoding (final-eval / submission) ────────────────────────────────────
# length_penalty 1.5 + min_length 40 address the "predictions too short"
# problem found in v2 prediction inspection. These only apply at final
# beam-search eval; training-time eval is greedy (hence the harmless
# length_penalty warning, now silenced in train.py).
decoding:
  default:
    num_beams: 8
    length_penalty: 2.5
    no_repeat_ngram: 3
    repetition_penalty: 1.2
    min_length: 70
  per_language:
    Eng_Uga: { num_beams: 8, length_penalty: 2.5, min_length: 70, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Eng_Ken: { num_beams: 8, length_penalty: 2.5, min_length: 70, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Lug_Uga: { num_beams: 6, length_penalty: 2.0, min_length: 50, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Aka_Gha: { num_beams: 6, length_penalty: 2.0, min_length: 50, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Swa_Ken: { num_beams: 8, length_penalty: 1.5, min_length: 40, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Eng_Gha: { num_beams: 8, length_penalty: 1.5, min_length: 40, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Amh_Eth: { num_beams: 8, length_penalty: 1.2, min_length: 30, no_repeat_ngram: 3, repetition_penalty: 1.2 }
    Eng_Eth: { num_beams: 8, length_penalty: 0.8, min_length: 30, no_repeat_ngram: 3, repetition_penalty: 1.2 }

evaluation:
  dump_predictions: true
  dump_predictions_n: 50
  dump_predictions_seed: 42
  dump_predictions_dir: prediction_dumps
  rouge_types:
  - rouge1
  - rougeL
  metric_weights:
    rouge1_f1: 0.37
    rougeL_f1: 0.37
    llm_judge: 0.26

tracking:
  backend: none
  experiment: african-health-qa
  run_name: mt0-xl-a100-80gb-bf16-lora-v3

serving:
  host: 0.0.0.0
  port: 8000
  disclaimer:
    Eng_Uga: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Gha: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Eth: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Ken: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Aka_Gha: Nsɛm yi yɛ nsɛm a wɔde ho kɔ adwene mu nko ara. Fa wo ho kɔ onyansafo
      okra ho adwene.
    Amh_Eth: ይህ መልስ ለመረጃ ዓላማ ብቻ ነው። እባክዎ ለሕክምና ምክር ብቁ ጤና ባለሙያ ያነጋግሩ።
    Lug_Uga: Okuddamu kuno kwe kulaga amawulire bukabu. Ndowooza ogende gy'omudaala
      omanyi.
    Swa_Ken: Jibu hili ni kwa madhumuni ya habari tu. Tafadhali wasiliana na mtaalamu
      wa afya.