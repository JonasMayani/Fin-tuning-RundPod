seed: 42
deterministic: true
paths:
  data_raw: /workspace/Fin-tuning-RundPod/data/raw
  data_cleaned: /workspace/Fin-tuning-RundPod/data/cleaned
  data_augmented: /workspace/Fin-tuning-RundPod/data/augmented
  data_external: /workspace/Fin-tuning-RundPod/data/external
  models: /workspace/Fin-tuning-RundPod/src/models/checkpoints
  submissions: /workspace/Fin-tuning-RundPod/src/submissions
  reports: /workspace/Fin-tuning-RundPod/src/reports
  logs: /workspace/Fin-tuning-RundPod/src/logs
dataset:
  train_file: data/augmented/final_train.csv
  val_file: data/cleaned/val_clean.csv
  test_file: data/raw/Test.csv
  id_col: ID
  input_col: input
  output_col: output
  subset_col: subset
  languages:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha
  - Eng_Eth
  - Lug_Uga
  - Eng_Ken
  - Swa_Ken
  - Amh_Eth
nllb_codes:
  Eng_Uga: eng_Latn
  Aka_Gha: aka_Latn
  Eng_Gha: eng_Latn
  Eng_Eth: eng_Latn
  Lug_Uga: lug_Latn
  Eng_Ken: eng_Latn
  Swa_Ken: swh_Latn
  Amh_Eth: amh_Ethi
model:
  base_model: google/mt5-large
  max_input_length: 256
  max_output_length: 256
  load_in_8bit: false
lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q
  - v
  - wi_0
  - wi_1
  bias: none
  task_type: SEQ_2_SEQ_LM
optimiser:
  type: adamw_torch
  lr: 3.0e-05
  weight_decay: 0.01
  lr_scheduler: cosine
  warmup_ratio: 0.03
  label_smoothing: 0.0
  max_grad_norm: 1.0
training:
  epochs: 10
  early_stopping_patience: 3
  per_device_train_batch: 64
  per_device_eval_batch: 128
  gradient_accumulation: 1
  mixed_precision: bf16
  gradient_checkpointing: false
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 2
  logging_steps: 50
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  eval_strategy: epoch
  predict_with_generate: true
  generation_num_beams: 1
  load_best_model_at_end: true
  metric_for_best_model: rougeL
  greater_is_better: true
  resume_from_checkpoint: auto
curriculum:
  enabled: true
  phase1_epochs: 2
  phase2_epochs: 8
  phase1_langs:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha
translation:
  model_name: facebook/nllb-200-1.3B
  num_beams: 2
  batch_size: 256
  max_length: 384
augmentation:
  target_ratio:
    Eng_Uga: 1.0
    Aka_Gha: 1.7
    Eng_Gha: 1.7
    Eng_Eth: 2.0
    Lug_Uga: 2.2
    Eng_Ken: 3.0
    Swa_Ken: 3.0
    Amh_Eth: 4.0
  chrf_threshold: 0.35
  semantic_cos_threshold: 0.3
  length_ratio_min: 0.5
  length_ratio_max: 20.0
temperature_sampling:
  enabled: true
  temperature: 5.0
decoding:
  default:
    num_beams: 8
    length_penalty: 0.8
    no_repeat_ngram: 3
    min_length: 10
  per_language:
    Aka_Gha:
      num_beams: 6
      length_penalty: 1.0
      no_repeat_ngram: 3
    Amh_Eth:
      num_beams: 8
      length_penalty: 0.8
      no_repeat_ngram: 2
    Lug_Uga:
      num_beams: 6
      length_penalty: 1.0
      no_repeat_ngram: 3
    Swa_Ken:
      num_beams: 8
      length_penalty: 0.8
      no_repeat_ngram: 3
    Eng_Uga:
      num_beams: 8
      length_penalty: 0.6
      no_repeat_ngram: 4
evaluation:
  rouge_types:
  - rouge1
  - rougeL
  metric_weights:
    rouge1_f1: 0.37
    rougeL_f1: 0.37
    llm_judge: 0.26
tracking:
  backend: none
  experiment: african-health-qa
  run_name: mt5-large-a40-bf16-lora-lr3e5
serving:
  host: 0.0.0.0
  port: 8000
  disclaimer:
    Eng_Uga: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Gha: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Eth: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Ken: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Aka_Gha: Nsɛm yi yɛ nsɛm a wɔde ho kɔ adwene mu nko ara. Fa wo ho kɔ onyansafo
      okra ho adwene.
    Amh_Eth: ይህ መልስ ለመረጃ ዓላማ ብቻ ነው። እባክዎ ለሕክምና ምክር ብቁ ጤና ባለሙያ ያነጋግሩ።
    Lug_Uga: Okuddamu kuno kwe kulaga amawulire bukabu. Ndowooza ogende gy'omudaala
      omanyi.
    Swa_Ken: Jibu hili ni kwa madhumuni ya habari tu. Tafadhali wasiliana na mtaalamu
      wa afya.
