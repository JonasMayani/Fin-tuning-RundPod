seed: 42
deterministic: true

paths:
  workspace: /workspace/Fin-tuning-RundPod
  data_raw: /workspace/Fin-tuning-RundPod/data/raw
  data_cleaned: /workspace/Fin-tuning-RundPod/data/cleaned
  data_augmented: /workspace/Fin-tuning-RundPod/data/augmented
  data_external: /workspace/Fin-tuning-RundPod/data/external
  models: /workspace/Fin-tuning-RundPod/src/models/checkpoints
  submissions: /workspace/Fin-tuning-RundPod/src/submissions
  reports: /workspace/Fin-tuning-RundPod/src/reports
  logs: /workspace/Fin-tuning-RundPod/src/logs

# ── Dataset selection ──────────────────────────────────────────────────────
dataset:
  train_file: data/cleaned/train_clean.csv
  val_file: data/cleaned/val_clean.csv
  test_file: data/raw/Test.csv
  id_col: ID
  input_col: input
  output_col: output
  subset_col: subset
  languages:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha
  - Eng_Eth
  - Lug_Uga
  - Eng_Ken
  - Swa_Ken
  - Amh_Eth

nllb_codes:
  Eng_Uga: eng_Latn
  Aka_Gha: aka_Latn
  Eng_Gha: eng_Latn
  Eng_Eth: eng_Latn
  Lug_Uga: lug_Latn
  Eng_Ken: eng_Latn
  Swa_Ken: swh_Latn
  Amh_Eth: amh_Ethi

# ─── Model ─────────────────────────────────────────────────────────────────
# mT0 is mT5 already instruction-tuned on xP3 (101 languages, 16 task families).
# Same architecture as mT5 → all existing code works unchanged. Same tokenizer.
#
# A100 80GB sizing (LoRA, bf16):
#   bigscience/mt0-large  (1.2B)  → weights ~2.4 GB, train batch 32 comfortable
#   bigscience/mt0-xl     (3.7B)  → weights ~7.4 GB, train batch 16 comfortable ← default
#   bigscience/mt0-xxl    (13B)   → needs QLoRA (load_in_4bit) at this size
model:
  base_model: bigscience/mt0-xl
  max_input_length: 256
  max_output_length: 384
  load_in_8bit: false
  use_fast_tokenizer: false        # SentencePiece — slow tokenizer is the safe path
  block_sentinel_tokens: true       # mT0 inherits mT5's <extra_id_*> tokens

# ─── LoRA ──────────────────────────────────────────────────────────────────
# alpha = r  →  scale = alpha / r = 1.0 (stabler than 2.0 from the mT5 run).
# Lower rank (32) is fine because mT0 is already instruction-tuned — we need
# less plasticity than a from-scratch mT5 fine-tune.
lora:
  enabled: true
  r: 64
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
  - q
  - k
  - v
  - o
  - wi_0
  - wi_1
  - wo
  bias: none
  task_type: SEQ_2_SEQ_LM

# ─── Optimiser ─────────────────────────────────────────────────────────────
# Lower LR (1e-5) because mT0 is already in a good region of weight space.
# Lower warmup (5%) for the same reason — long warmup is for cold starts.
# Tighter grad clip (0.5) is a belt-and-braces guard given the bf16 history.
optimiser:
  type: adamw_torch
  lr: 3.0e-5
  weight_decay: 0.01
  lr_scheduler: cosine
  warmup_ratio: 0.05
  label_smoothing: 0.0
  max_grad_norm: 1.0

# ─── Training ──────────────────────────────────────────────────────────────
# Batch sizing for mT0-XL on A100 80GB:
#   train batch 16 × accum 4 = effective 64 — fits with healthy headroom.
#   The OOM-retry loop in train.py will auto-halve and double accum if needed.
#
# epochs: 3 — mT0 typically converges 2–3× faster than mT5 on QA.
# eval_steps / save_steps: 500 — frequent enough to recover from OOM cheaply,
#   not so frequent that we burn hours on eval.
# eval_max_samples: 800 — stratified subsample during training eval, full eval
#   at the end of each phase. Saves ~5x on eval time.
# generation_num_beams: 1 (greedy) during training; final beam search runs
#   from src/scripts/eval.py separately on the full val set.
training:
  epochs: 3
  output_dir_suffix: mt0_xl_a100
  early_stopping_patience: 2

  # Auto batch sizing (initial, pre-OOM)
  auto_batch_size: true
  target_effective_batch: 64
  per_device_train_batch: 16
  per_device_eval_batch: 32
  gradient_accumulation: 4

  # Bounds the OOM retry loop respects
  min_batch_size: 1
  min_per_device_train_batch: 1
  max_per_device_train_batch: 32
  min_per_device_eval_batch: 1
  max_per_device_eval_batch: 64
  eval_batch_multiplier: 2.0

  # Native HF auto_find_batch_size as a second line of defence (in addition
  # to our outer retry). Set to false if it conflicts with custom OOM logic.
  auto_find_batch_size: false

  mixed_precision: bf16
  gradient_checkpointing: false     # plenty of VRAM for mT0-XL with LoRA
  dataloader_num_workers: 8
  dataloader_prefetch_factor: 2
  logging_steps: 25
  eval_enabled: true
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  save_safetensors: true
  predict_with_generate: true
  generation_num_beams: 1           # greedy during training — fast
  load_best_model_at_end: true
  metric_for_best_model: rougeL
  greater_is_better: true
  resume_from_checkpoint: auto      # picks up last checkpoint if it exists

  # NEW: cap eval set size during training to keep eval fast.
  # Set to 0 to disable subsampling and eval on the full val set.
  eval_max_samples: 800

# ─── Curriculum (disabled by default for mT0) ──────────────────────────────
# mT0 already speaks all these languages. The cross-language pre-finetune
# from a curriculum is less useful than for raw mT5.
curriculum:
  enabled: false
  phase1_epochs: 3
  phase2_epochs: 5
  phase1_langs:
  - Eng_Uga
  - Aka_Gha
  - Eng_Gha

# ─── Back-translation / NLLB (unchanged) ───────────────────────────────────
translation:
  model_name: facebook/nllb-200-1.3B
  num_beams: 2
  batch_size: 384
  max_length: 384

augmentation:
  target_ratio:
    Eng_Uga: 1.0
    Eng_Uga: 1.0
    Aka_Gha: 1.7
    Eng_Gha: 1.7
    Eng_Eth: 2.0
    Lug_Uga: 2.2
    Eng_Ken: 3.0
    Swa_Ken: 3.0
    Amh_Eth: 4.0
  chrf_threshold: 0.10
  chrf_threshold_per_lang:
    Aka_Gha: 0.20
    Lug_Uga: 0.15
    Swa_Ken: 0.10
    Amh_Eth: 0.0005
  semantic_cos_threshold: 0.3
  length_ratio_min: 0.5
  length_ratio_max: 20.0

quality_gate:
  min_question_tokens: 5
  min_answer_tokens: 10
  max_answer_tokens: 512
  lang_id_workers: 8
  near_dedup_threshold: 0.85
  toxicity_threshold: 0.5
  toxicity_batch_size: 64
  semantic_cos_threshold: 0.55
  semantic_batch_size: 128
  max_repetition_ratio: 0.4
  repetition_ngram_size: 4
  max_novel_token_ratio: 0.6
  skip_medical_keyword_gate: true
  skip_hallucination_gate: true

temperature_sampling:
  enabled: true
  enabled: true
  temperature: 5.0

# ─── Decoding (final-eval / submission) ────────────────────────────────────
decoding:
  default:
    num_beams: 8
    length_penalty: 0.8
    no_repeat_ngram: 4
    repetition_penalty: 1.2
    min_length: 10
  per_language:
    Aka_Gha:
      num_beams: 6
      length_penalty: 1.0
      num_beams: 6
      length_penalty: 1.0
      no_repeat_ngram: 3
    Amh_Eth:
      num_beams: 8
      length_penalty: 0.8
      num_beams: 8
      length_penalty: 0.8
      no_repeat_ngram: 2
    Lug_Uga:
      num_beams: 6
      length_penalty: 1.0
      num_beams: 6
      length_penalty: 1.0
      no_repeat_ngram: 3
    Swa_Ken:
      num_beams: 8
      length_penalty: 0.8
      num_beams: 8
      length_penalty: 0.8
      no_repeat_ngram: 3
    Eng_Uga:
      num_beams: 8
      length_penalty: 0.6
      num_beams: 8
      length_penalty: 0.6
      no_repeat_ngram: 4

evaluation:
  dump_predictions: true
  dump_predictions_n: 50
  dump_predictions_seed: 42
  dump_predictions_dir: prediction_dumps
  rouge_types:
  - rouge1
  - rougeL
  metric_weights:
    rouge1_f1: 0.37
    rougeL_f1: 0.37
    llm_judge: 0.26

tracking:
  backend: none
  experiment: african-health-qa
  run_name: mt0-xl-a100-80gb-bf16-lora-v1

serving:
  host: 0.0.0.0
  port: 8000
  host: 0.0.0.0
  port: 8000
  disclaimer:
    Eng_Uga: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Gha: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Eth: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Eng_Ken: This answer is for informational purposes only. Please consult a qualified
      health professional.
    Aka_Gha: Nsɛm yi yɛ nsɛm a wɔde ho kɔ adwene mu nko ara. Fa wo ho kɔ onyansafo
      okra ho adwene.
    Amh_Eth: ይህ መልስ ለመረጃ ዓላማ ብቻ ነው። እባክዎ ለሕክምና ምክር ብቁ ጤና ባለሙያ ያነጋግሩ።
    Lug_Uga: Okuddamu kuno kwe kulaga amawulire bukabu. Ndowooza ogende gy'omudaala
      omanyi.
    Swa_Ken: Jibu hili ni kwa madhumuni ya habari tu. Tafadhali wasiliana na mtaalamu
